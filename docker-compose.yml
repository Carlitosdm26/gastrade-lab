services:
  gastradelab:
    build: .
    container_name: gastradelab
    restart: unless-stopped
    ports:
      - "${GASTRADELAB_PORT:-8080}:8080"
    environment:
      DATABASE_URL: ${DATABASE_URL:-sqlite:////data/papertrade.db}
      MARKET_POLL_SECONDS: ${MARKET_POLL_SECONDS:-60}
    volumes:
      - papertrade_data:/data
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/api/health', timeout=5)"
      interval: 30s
      timeout: 8s
      retries: 3
      start_period: 20s

volumes:
  # Keep the existing volume key so stored experiments remain available.
  papertrade_data:
